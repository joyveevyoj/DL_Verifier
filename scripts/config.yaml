# Model Configuration
MODEL_NAME: "Qwen/Qwen3-0.6B"

# Dataset Paths
# Use relative path from project root
TRAIN_DATASET_PATH: "data/verifier_dataset_train.json"

# Device Configuration
# Options: "cuda", "cpu", "mps" (for Apple Silicon)
# If set to "auto", will automatically detect available device
DEVICE: "auto"
P_AUC_MAX_FPR: 0.3

# BCE Training Configuration
BCE_TRAIN:
  BATCH_SIZE: 32
  GRAD_ACCUMULATION_STEPS: 4
  EPOCH_NUM: 10
  LEARNING_RATE: 0.0001  # 1e-4
  MAX_GRAD_NORM: 1.0
  WARMUP_RATIO: 0.1
  MAX_LENGTH: 256
  DEBUG_SAMPLE_SIZE: null  # Set to null for full dataset
  OUTPUT_DIR: "./outputs"  # Directory to save BCE training outputs. Full dir will be OUTPUT_DIR/{mode}_{timestamp}
  CHECKPOINT_DIR: "./checkpoints"  # Path to save BCE checkpoints.  Full dir will be CHECKPOINT_DIR/{mode}_{timestamp}
  LORA_R: 8
  LORA_ALPHA: 16
  LORA_DROPOUT: 0.1
  VAL_STEP_INTERVAL: 100  # Validate every N steps
  START_FROM_CHECKPOINT: null

# pAUC Training Configuration
PAUC_TRAIN:
  BATCH_SIZE: 32
  GRAD_ACCUMULATION_STEPS: 4
  EPOCH_NUM: 10
  LEARNING_RATE: 0.0001  # 1e-4
  MAX_GRAD_NORM: 1.0
  WARMUP_RATIO: 0.1
  MAX_LENGTH: 256
  DEBUG_SAMPLE_SIZE: null  # Set to null for full dataset
  OUTPUT_DIR: "./outputs"  # Directory to save pAUC outputs. Full dir will be OUTPUT_DIR/{mode}_{timestamp}
  CHECKPOINT_DIR: "./checkpoints"  # Path to save pAUC checkpoints.  Full dir will be CHECKPOINT_DIR/{mode}_{timestamp}
  MARGIN: 0.8
  GAMMA: 0.5
  # NOTE: use an explicit float so YAML always parses it as numeric (not a string)
  WEIGHT_DECAY: 2.0e-4
  LORA_R: 8
  LORA_ALPHA: 16
  LORA_DROPOUT: 0.1
  VAL_STEP_INTERVAL: 100  # Validate every N steps
  START_FROM_CHECKPOINT: null
  SAMPLING_RATE: 0.5
